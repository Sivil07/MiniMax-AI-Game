<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/fonts.css">
    <link rel="stylesheet" href="./public/css/styles.css">
    <title>Tick Tac Toe</title>
</head>

<body>
    <form id="landing-page">
        <h1 id="landing-title">Tic Tac Toe</h1>
        <p class="landing-details">Choose your fighters</p>
        <div class="player-options">
            <div class="option-one">
                <input id="radio-one" type="radio" name="opponent-type" value="bot-opponent" checked>
                <label class="options" for="radio-one">Player Vs Bot</label>
            </div>
            <div class="option-two">
                <input id="radio-two" type="radio" name="opponent-type" value="human-opponent">
                <label class="options" for="radio-two">Player Vs Player</label>
            </div>
            <div class="container">
                <button type="button" class="difficulty-action">Select Difficulty</button>
                <div class="difficulty-group hidden">
                    <div class="difficulty-types">
                        <input type="radio" id="difficulty-one" name="difficulty-option" value="Easy">
                        <label for="difficulty-one">Easy</label>
                    </div>
                    <div class="difficulty-types">
                        <input type="radio" id="difficulty-two" name="difficulty-option" value="Expert">
                        <label for="difficulty-two">Expert</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="player-cards">
            <div class="players">
                <label class="player-name" for="player-one">Player One</label>
                <input id="player-one" class="player-input" type="text" placeholder="Enter name" name="player-one-name">
                <div class="mark-selections">
                    <input id="player-radio-one" type="radio" name="player-one-mark" value="X" checked>
                    <label class="mark x-mark" for="player-radio-one">X</label>
                    <input id="player-radio-two" type="radio" name="player-one-mark" value="O">
                    <label class="mark o-mark" for="player-radio-two">O</label>
                </div>
            </div>
            <div class="players">
                <label class="player-name" for="player-two">Player Two</label>
                <input id="player-two" class="player-input" type="text" placeholder="Enter name" name="player-two-name">
                <div class="mark-selections">
                    <input id="radio-five" type="radio" name="player-two-mark" value="X">
                    <label class="mark x-mark" for="radio-five">X</label>
                    <input id="radio-six" type="radio" name="player-two-mark" value="O" checked>
                    <label class="mark o-mark" for="radio-six">O</label>
                </div>
            </div>
        </div>
        <button type="button" class="start-game">Start Game</button>
    </form>
    <script src="./public/js/createPlayer.js"></script>
    <script src="./public/js/createSquare.js"></script>
    <script src="./public/js/GameConstraintsModule.js"></script>
    <script src="./public/js/GameBoardModule.js"></script>
    <script src="./public/js/WinDetectionModule.js"></script>
    <script src="./public/js/AIModelModule.js"></script>
    <script src="./public/js/GameMasterModule.js"></script>
    
    <!-- <script src="./public/js/index.js"></script> -->
</body>

</html>
