<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/fonts.css">
    <link rel="stylesheet" href="./public/css/styles.css">
    <title>Tick Tac Toe</title>
</head>

<body>
    <form class="landing-page">
        <h1 id="landing-title">Tic Tac Toe</h1>
        <p class="landing-details">Choose your fighters</p>
        <div class="match-options">
            <div class="mode-options">
                <input id="mode-bot" type="radio" name="opponentType" value="bot-opponent">
                <label class="mode-labels" for="mode-bot">Player Vs Bot</label>
            </div>
            <div class="mode-options">
                <input id="mode-pvp" type="radio" name="opponentType" value="human-opponent">
                <label class="mode-labels" for="mode-pvp">Player Vs Player</label>
            </div>
            <div class="difficulty-dropdown">
                <button type="button" class="difficulty-action">Select Difficulty</button>
                <div class="difficulty-group">
                    <div class="difficulty-choice">
                        <input type="radio" id="difficulty-easy" name="difficultyOption" value="Easy">
                        <label for="difficulty-easy">Easy</label>
                    </div>
                    <div class="difficulty-choice">
                        <input type="radio" id="difficulty-expert" name="difficultyOption" value="Expert">
                        <label for="difficulty-expert">Expert</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="player-cards">
            <div id="player-one-card" class="players">
                <label class="player-name" for="player-one-input">Player One</label>
                <input id="player-one-input" class="player-inputs" type="text" placeholder="Enter name"
                    name="playerOneName" required>
                <div class="mark-selections">
                    <input id="player-one-mark-x" type="radio" name="playerOneMark" value="X" checked required>
                    <label class="mark x-mark" for="player-one-mark-x">X</label>
                    <input id="player-one-mark-o" type="radio" name="playerOneMark" value="O">
                    <label class="mark o-mark" for="player-one-mark-o">O</label>
                </div>
            </div>
            <div id="player-two-card" class="players">
                <label class="player-name" for="player-two">Player Two</label>
                <input id="player-two" class="player-inputs" type="text" placeholder="Enter name" name="playerTwoName">
                <div class="mark-selections">
                    <input id="player-two-mark-x" type="radio" name="playerTwoMark" value="X">
                    <label class="mark x-mark" for="player-two-mark-x">X</label>
                    <input id="player-two-mark-o" type="radio" name="playerTwoMark" value="O" checked>
                    <label class="mark o-mark" for="player-two-mark-o">O</label>
                </div>
            </div>
        </div>
        <button type="submit" class="start-game animate-gradient">Start Game</button>
    </form>
    <div id="loading-screen" class="remove-node">
        <div class="spinner-container">
            <div class="spinner-ring"></div>
            <div class="mark-display">
                <p id="x-mark" class="pulse-x">X</p>
                <p id="o-mark" class="pulse-y">O</p>
            </div>
        </div>
        <p class="loading-text">Loading</p>
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
    </div>
    <script src="./public/js/UIModule.js"></script>
    <script src="./public/js/createPlayer.js"></script>
    <script src="./public/js/createSquare.js"></script>
    <script src="./public/js/GameConstraintsModule.js"></script>
    <script src="./public/js/GameBoardModule.js"></script>
    <script src="./public/js/WinDetectionModule.js"></script>
    <script src="./public/js/AIModelModule.js"></script>
    <script src="./public/js/GameMasterModule.js"></script>
    <script src="./public/js/UIFunctionalityModule.js"></script>

    <!-- <script src="./public/js/index.js"></script> -->
</body>

</html>
