<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./public/css/fonts.css">
    <link rel="stylesheet" href="./public/css/styles.css">
    <title>Tick Tac Toe</title>
</head>

<body>
    <form class="landing-page">
        <h1 id="landing-title">Tic Tac Toe</h1>
        <p class="landing-details">Choose your fighters</p>
        <div class="match-options">
            <div class="mode-options">
                <input id="mode-bot" type="radio" name="opponentType" value="bot-opponent">
                <label class="mode-labels" for="mode-bot">Player Vs Bot</label>
            </div>
            <div class="mode-options">
                <input id="mode-pvp" type="radio" name="opponentType" value="human-opponent">
                <label class="mode-labels" for="mode-pvp">Player Vs Player</label>
            </div>
            <div class="difficulty-dropdown">
                <button type="button" class="difficulty-action">Select Difficulty</button>
                <div class="difficulty-group">
                    <div class="difficulty-choice">
                        <input type="radio" id="difficulty-easy" name="difficultyOption" value="Easy">
                        <label for="difficulty-easy">Easy</label>
                    </div>
                    <div class="difficulty-choice">
                        <input type="radio" id="difficulty-expert" name="difficultyOption" value="Expert">
                        <label for="difficulty-expert">Expert</label>
                    </div>
                </div>
            </div>
        </div>
        <div class="player-cards">
            <div id="player-one-card" class="players">
                <label class="player-name" for="player-one-input">Player One</label>
                <input id="player-one-input" class="player-inputs" type="text" placeholder="Enter name"
                    name="playerOneName" required>
                <div class="mark-selections">
                    <input id="player-one-mark-x" type="radio" name="playerOneMark" value="X" checked required>
                    <label class="mark x-mark" for="player-one-mark-x">X</label>
                    <input id="player-one-mark-o" type="radio" name="playerOneMark" value="O">
                    <label class="mark o-mark" for="player-one-mark-o">O</label>
                </div>
            </div>
            <div id="player-two-card" class="players">
                <label class="player-name" for="player-two">Player Two</label>
                <input id="player-two" class="player-inputs" type="text" placeholder="Enter name" name="playerTwoName">
                <div class="mark-selections">
                    <input id="player-two-mark-x" type="radio" name="playerTwoMark" value="X">
                    <label class="mark x-mark" for="player-two-mark-x">X</label>
                    <input id="player-two-mark-o" type="radio" name="playerTwoMark" value="O" checked>
                    <label class="mark o-mark" for="player-two-mark-o">O</label>
                </div>
            </div>
        </div>
        <button type="submit" class="start-game animate-gradient">Start Game</button>
    </form>
    <div class="loading-screen remove-node">
        <div class="spinner-container">
            <div class="spinner-ring spin"></div>
            <div class="mark-display">
                <p id="x-mark" class="pulse-X">X</p>
                <p id="o-mark" class="pulse-O">O</p>
            </div>
        </div>
        <p class="loading-text">Loading</p>
        <div class="progress-track">
            <div class="progress-fill loading-bar"></div>
        </div>
    </div>
    <main class="game-container remove-node">
        <section class="round-info-container">
            <!-- <p id="round-number" class="round-info">Round 3</p> -->
            <p id="static-mode-label" class="round-info"></p>
        </section>
        <section class="game">
            <div id="player-one-side" class="side">
                <div class="player-info">
                    <p id="static-player-one-mark" class="mark-badge"></p>
                    <p id="static-player-one-name" class="player-username"></p>
                    <!-- <p id="player-one-score" class="score">2</p> -->
                </div>
                <div class="player-streak-info">
                    <!-- <p id="player-one-streak" class="streak">Streak 2</p> -->
                    <div class="win-loss">
                        <!-- <p id="player-one-wins" class="wins">W 2</p> -->
                        <!-- <p id="player-one-losses" class="losses">L 1</p> -->
                    </div>
                </div>
            </div>
            <div id="board-section">
                <!-- <p id="player-turn">Bot's Turn</p> -->
                <div class="board">
                    <!-- <button type="button" class="square" data-row="0" data-col="0"></button>
                    <button type="button" class="square" data-row="0" data-col="1"></button>
                    <button type="button" class="square" data-row="0" data-col="2"></button>
                    <button type="button" class="square" data-row="1" data-col="0"></button>
                    <button type="button" class="square" data-row="1" data-col="1"></button>
                    <button type="button" class="square" data-row="1" data-col="2"></button>
                    <button type="button" class="square" data-row="2" data-col="0"></button>
                    <button type="button" class="square" data-row="2" data-col="1"></button>
                    <button type="button" class="square" data-row="2" data-col="2"></button> -->
                    <div class="backdrop backdrop-not-shown">
                        <p class="backdrop-content prevent-click hide-winning-player"></p>
                    </div>
                </div>
            </div>
            <div id="player-two-side" class="side">
                <div class="player-info">
                    <p id="static-player-two-mark" class="mark-badge"></p>
                    <p id="static-player-two-name" class="player-username"></p>
                    <!-- <p id="player-two-score" class="score">0</p> -->
                </div>
                <div class="player-streak-info">
                    <!-- <p id="player-two-streak" class="streak">Streak 0</p> -->
                    <div class="win-loss">
                        <!-- <p id="player-two-wins" class="wins">W 1</p> -->
                        <!-- <p id="player-two-losses" class="losses">L 2</p> -->
                    </div>
                </div>
            </div>
        </section>
        <section id="game-controls">
            <button id="end-game" type="button" class="control-item">End Game</button>
            <button id="next-round" type="button" class="control-item" disabled>Next Round</button>
        </section>
    </main>
    <script src="./public/js/createPlayer.js" defer></script>
    <script src="./public/js/createSquare.js" defer></script>
    <script src="./public/js/GameConstraintsModule.js" defer></script>
    <script src="./public/js/GameBoardModule.js" defer></script>
    <script src="./public/js/WinDetectionModule.js" defer></script>
    <script src="./public/js/AIModelModule.js" defer></script>
    <script src="./public/js/GameMasterModule.js" defer></script>
    <script src="./public/js/LandingScreen.js" defer></script>
    <script src="./public/js/LoadingScreen.js" defer></script>
    <script src="./public/js/GameScreen.js" defer></script>
</body>

</html>
